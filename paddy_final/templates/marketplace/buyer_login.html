{% extends 'base.html' %}
{% block title %}Buyer Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-4">
<div class="card">
<div class="card-header">🏭 Private Buyer Login</div>
<div class="card-body">
<form method="post">
{% csrf_token %}
<div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Password</label><input name="password" type="password" class="form-control" required></div>
<button class="btn btn-primary w-100">Login</button>
<div class="text-center mt-3"><small>New buyer? <a href="{% url 'buyer_register' %}">Register here</a></small></div>
</form>
</div></div></div></div>
{% endblock %}
