{% extends 'base.html' %}
{% block title %}Buyer Registration{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-7">
<div class="card">
<div class="card-header">🏭 Register as Private Buyer</div>
<div class="card-body">
<p class="text-muted small">Rice mills, wholesalers, exporters can register here to post offers and buy directly from farmers.</p>
<form method="post">
{% csrf_token %}
<div class="row g-3">
    <div class="col-md-6"><label class="form-label">Company Name *</label><input name="company_name" class="form-control" required value="{{ post.company_name|default:'' }}"></div>
    <div class="col-md-6"><label class="form-label">Buyer Type *</label>
        <select name="buyer_type" class="form-select" required>
            {% for val, label in buyer_types %}<option value="{{ val }}" {% if post.buyer_type == val %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
    </div>
    <div class="col-md-6"><label class="form-label">Contact Person *</label><input name="contact_name" class="form-control" required value="{{ post.contact_name|default:'' }}"></div>
    <div class="col-md-6"><label class="form-label">Phone *</label><input name="phone" class="form-control" required value="{{ post.phone|default:'' }}"></div>
    <div class="col-md-6"><label class="form-label">Username *</label><input name="username" class="form-control" required value="{{ post.username|default:'' }}"></div>
    <div class="col-md-6"><label class="form-label">Email</label><input name="email" type="email" class="form-control" value="{{ post.email|default:'' }}"></div>
    <div class="col-md-6"><label class="form-label">Password *</label><input name="password1" type="password" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Confirm Password *</label><input name="password2" type="password" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">License No.</label><input name="license_no" class="form-control" value="{{ post.license_no|default:'' }}"></div>
    <div class="col-md-6"><label class="form-label">GST Number</label><input name="gst_number" class="form-control" value="{{ post.gst_number|default:'' }}"></div>
    <div class="col-md-6"><label class="form-label">District *</label><input name="district" class="form-control" required value="{{ post.district|default:'' }}"></div>
    <div class="col-md-6"><label class="form-label">State</label><input name="state" class="form-control" value="{{ post.state|default:'Andhra Pradesh' }}"></div>
    <div class="col-12"><label class="form-label">Address *</label><textarea name="address" class="form-control" rows="2" required>{{ post.address|default:'' }}</textarea></div>
    <div class="col-12"><button class="btn btn-primary w-100">Register as Buyer</button></div>
    <div class="col-12 text-center"><small>Already registered? <a href="{% url 'buyer_login' %}">Login here</a></small></div>
</div>
</form>
</div></div></div></div>
{% endblock %}
